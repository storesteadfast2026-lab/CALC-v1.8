<style>
  #carriers-striped {
    color-scheme: light dark;
    --surface: light-dark(#fff, #1b252c);
    --stripe: light-dark(#eaf3f7, #263a46);
    --ink: light-dark(#21313a, #e3ebef);
    --muted: light-dark(#4e646f, #b4c8d3);
    --border: light-dark(#cddde4, #405764);
    --link: light-dark(#215e78, #a1dced);
    --action: light-dark(#205568, #2b6075);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: clip;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #carriers-striped header, #carriers-striped footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    flex-wrap: wrap;
    padding: 8px 12px;
  }
  #carriers-striped header h2 { margin: 0; font: 600 17px/1.4 system-ui, sans-serif; }
  #carriers-striped footer, #carriers-striped thead { border-top: 1px solid var(--border); }
  #carriers-striped table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #carriers-striped th, #carriers-striped td { padding: 3px 7px; text-align: left; vertical-align: middle; }
  #carriers-striped th { color: var(--muted); font-size: 12px; font-weight: 500; }
  #carriers-striped table tbody:nth-of-type(odd) { background: var(--stripe); }
  #carriers-striped .kind { width: 5rem; padding-inline-start: 12px; }
  #carriers-striped .carrier .kind { font-weight: 650; }
  #carriers-striped .service .kind { color: var(--muted); padding-inline-start: 17px; }
  #carriers-striped .code { width: 22%; }
  #carriers-striped .active { width: 3rem; text-align: center; }
  #carriers-striped .details { width: 4rem; }
  #carriers-striped .details, #carriers-striped .kind, #carriers-striped a { font-size: 12px; }
  #carriers-striped input[type=text] {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 25px;
    padding: 2px 6px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
  }
  #carriers-striped input[type=checkbox] { margin: 0; accent-color: var(--action); }
  #carriers-striped a { color: var(--link); text-underline-offset: 3px; }
  #carriers-striped .save { padding: 5px 10px; border: 0; border-radius: 4px; background: var(--action); color: #fff; font: inherit; }
  #carriers-striped output { color: var(--muted); font-size: 12px; }
  #carriers-striped dialog { width: min(24rem, 80%); color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; }
  #carriers-striped dialog::backdrop { background: #0005; }
  @media (max-width: 460px) {
    #carriers-striped td, #carriers-striped th { padding-inline: 3px; }
    #carriers-striped .kind { width: 3.65rem; padding-inline-start: 5px; }
    #carriers-striped .service .kind { padding-inline-start: 6px; }
    #carriers-striped .active { width: 2.4rem; }
    #carriers-striped .details { width: 2.75rem; }
  }
</style>
<section id="carriers-striped" aria-label="Tabla jerárquica de Carriers">
  <header>
    <h2>Carriers</h2>
    <a href="#" data-detail="Client carrier configs">Client carrier configs</a>
  </header>
  <form class="edit-form">
    <table aria-label="Transportistas y servicios">
      <thead>
        <tr>
          <th scope="col" class="kind">Type</th>
          <th scope="col" class="code">Code</th>
          <th scope="col">Name</th>
          <th scope="col" class="active">Active</th>
          <th scope="col" class="details"></th>
        </tr>
      </thead>
    </table>
    <footer><button class="save" type="submit">Save changes</button><output aria-live="polite"></output></footer>
  </form>
  <dialog aria-label="Detalle de la vista previa">
    <p class="detail-name"></p>
    <form method="dialog"><button type="submit">Cerrar</button></form>
  </dialog>
</section>
<script>
  (() => {
    const screen = document.getElementById('carriers-striped');
    const table = screen.querySelector('table');
    const form = screen.querySelector('.edit-form');
    const status = screen.querySelector('output');
    const dialog = screen.querySelector('dialog');
    const records = [
      ['COCHRN', ['ROAD']],
      ['CUST', ['COLLECT']],
      ['IPEC', ['ROAD']],
      ['KTI', ['GENERAL']],
      ['TEAMEX', ['GENERAL', 'ROAD']],
    ];

    function row(carrier, service) {
      const code = service || carrier;
      const name = service ? carrier + ' / ' + service : carrier;
      const detail = (service ? 'Change carrier service · ' : 'Change carrier · ') + name;
      return `<tr class="${service ? 'service' : 'carrier'}">
        <td class="kind">${service ? '<span aria-hidden="true">↳</span> Service' : 'Carrier'}</td>
        <td><input type="text" value="${code}" maxlength="40" aria-label="${name} code"></td>
        <td><input type="text" value="${code}" maxlength="150" aria-label="${name} name"></td>
        <td class="active"><input type="checkbox" checked aria-label="${name} active"></td>
        <td class="details"><a href="#" data-detail="${detail}" aria-label="${detail}">Details</a></td>
      </tr>`;
    }

    for (const [carrier, services] of records) {
      const group = table.createTBody();
      group.setAttribute('aria-label', carrier);
      group.innerHTML = row(carrier) + services.map(service => row(carrier, service)).join('');
    }

    form.addEventListener('input', () => { status.textContent = 'Cambios pendientes'; });
    form.addEventListener('submit', event => {
      event.preventDefault();
      status.textContent = 'Cambios guardados en la vista previa';
    });
    screen.querySelectorAll('[data-detail]').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        dialog.querySelector('.detail-name').textContent = link.dataset.detail;
        dialog.showModal();
      });
    });
  })();
</script>
